# Builds the distributions on every push and publishes them to PyPI when a release is published.
# The version is derived from the git tag by hatch-vcs, so the full history has to be fetched.

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata
        run: pipx run twine check dist/*

      # hatch-vcs falls back to a dev version if the tag is not reachable, which would
      # silently publish something else than the release.
      - name: Check the built version matches the release tag
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! ls "dist/phasespace_jax-${version}-"*.whl >/dev/null 2>&1; then
            echo "::error::built distributions do not match tag ${GITHUB_REF_NAME}:"
            ls dist
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: [dist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phasespace-jax
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

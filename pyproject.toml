[build-system]
requires = ["hatchling>=1.17.1", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "phasespace-jax"
description = "JAX implementation of the Raubold and Lynch method for n-body events"
authors = [{ name = "Albert Puig Navarro", email = "apuignav@gmail.com" }]
maintainers = [{ name = "Melvin Strobl", email = "stroblme@posteo.de" }]
license = { text = "BSD-3-Clause" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["JAX", "phasespace", "HEP"]
urls = { Homepage = "https://github.com/stroblme/phasespace-jax" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.35",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
fromdecay = [
    "particle >= 0.25.0",
    "decaylanguage >= 0.19.0", # not required but everyone using this feature will likely use DecayLanguage
]
vector = ["vector >= 1.5.2"]
all = [
    "phasespace-jax[fromdecay]",
    "phasespace-jax[vector]",
]
test = [
    "phasespace-jax[all]",
    "awkward>=2.7",
    "coverage",
    "flaky",
    "matplotlib",
    "nbval",
    "numpy",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "scipy",
    "uproot>=5.5.0",
    "wget",
]
doc = [
    "phasespace-jax[fromdecay]",
    "phasespace-jax[vector]",
    "graphviz",
    "Sphinx",
    "myst-nb",
    "pydata-sphinx-theme",
    "jupyter_sphinx",
    "sphinx-math-dollar",
]
dev = [
    "phasespace-jax[doc]",
    "phasespace-jax[test]",
    "pre-commit",
    "ruff",
    "ty",
    "twine",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/phasespace/_version.py"
metadata.allow-direct-references = true

# the distribution is named phasespace-jax, the import package stays phasespace
[tool.hatch.build.targets.wheel]
packages = ["src/phasespace"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "paper", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003", # ambiguous unicode in physics docstrings
    "B905", # zip(..., strict=) would change behaviour of existing code
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["E402"]
"tests/test_physics.py" = ["E402"] # matplotlib backend has to be set before importing pyplot

[tool.ty.rules]
unresolved-import = "ignore"  # optional extras (vector, particle, decaylanguage)

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
addopts = """
--color=yes
--ignore=setup.py"""
filterwarnings = ["ignore:.*the imp module is deprecated in favour of importlib.*:DeprecationWarning"]
norecursedirs = ["tests/helpers"]
